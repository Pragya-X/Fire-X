# Local demonstration only; production overrides are in docker-compose.production.yml.

services:
  postgres:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: firex
      POSTGRES_PASSWORD: firex
      POSTGRES_DB: firex
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U firex"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql://firex:firex@postgres:5432/firex
      JWT_SECRET: firex-docker-secret-change-me
      CORS_ORIGINS: "*"
      DEMO_MODE: "true"
    ports:
      - "8000:8000"
    volumes:
      - ./ml/models:/app/models
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health')"]
      interval: 15s
      timeout: 5s
      retries: 5

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres_data: